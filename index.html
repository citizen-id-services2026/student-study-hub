<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 1 English Learning Course</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, "Noto Sans Devanagari", sans-serif;
    background:#f4f7fb;
    color:#222;
    line-height:1.6;
}

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    font-size:30px;
    margin-bottom:6px;
}

header p{
    font-size:16px;
}

.container{
    width:94%;
    max-width:950px;
    margin:20px auto;
}

/* COURSE INTRO */

.course-card{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.08);
    margin-bottom:20px;
    text-align:center;
}

.course-card h2{
    color:#2563eb;
    margin-bottom:8px;
}

.start-btn{
    border:none;
    background:#16a34a;
    color:white;
    padding:14px 25px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

.start-btn:hover{
    background:#15803d;
}

/* PROGRESS */

.progress-box{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.progress-bar{
    height:14px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
    margin-top:8px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#2563eb;
    transition:.3s;
}

/* TOPIC LIST */

#topicList{
    display:none;
}

.topic-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.topic-btn{
    border:none;
    background:white;
    padding:16px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    text-align:left;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.topic-btn:hover{
    background:#eff6ff;
}

.topic-number{
    color:#2563eb;
}

/* LESSON */

#lessonArea{
    display:none;
}

.lesson{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.lesson-title{
    color:#2563eb;
    margin-bottom:10px;
}

.lesson-subtitle{
    color:#7c3aed;
    margin:18px 0 8px;
}

.example{
    background:#eff6ff;
    border-left:5px solid #2563eb;
    padding:13px;
    margin:10px 0;
    border-radius:8px;
}

.hindi{
    background:#fff7ed;
    border-left:5px solid #f97316;
    padding:13px;
    margin:10px 0;
    border-radius:8px;
}

.practice{
    background:#f0fdf4;
    padding:16px;
    margin-top:18px;
    border-radius:12px;
}

.question{
    background:#fafafa;
    padding:15px;
    margin-top:12px;
    border-radius:10px;
    border:1px solid #e5e7eb;
}

.option{
    display:block;
    width:100%;
    padding:11px;
    margin:7px 0;
    border:1px solid #d1d5db;
    background:white;
    border-radius:8px;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.option:hover{
    background:#f3f4f6;
}

.option.correct{
    background:#dcfce7;
    border-color:#16a34a;
}

.option.wrong{
    background:#fee2e2;
    border-color:#dc2626;
}

.result{
    font-weight:bold;
    margin-top:10px;
}

.score{
    font-size:18px;
    color:#16a34a;
    margin-top:15px;
}

/* NAVIGATION */

.navigation{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.navigation button{
    flex:1;
    border:none;
    padding:13px;
    border-radius:10px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.prev{
    background:#64748b;
}

.next{
    background:#2563eb;
}

.topic-back{
    background:#111827;
    color:white;
    border:none;
    padding:13px 20px;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
    width:100%;
    font-size:15px;
}

/* FOOTER */

footer{
    text-align:center;
    padding:25px 10px;
    margin-top:30px;
    background:#111827;
    color:white;
    font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .container{
        width:95%;
    }

    .topic-grid{
        grid-template-columns:1fr;
    }

    .lesson{
        padding:17px;
    }

    .navigation{
        flex-direction:column;
    }

    .navigation button{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Class 1 English Course</h1>
    <p>Zero से English सीखें — पढ़ें, बोलें, लिखें और Practice करें</p>
</header>

<div class="container">

    <!-- INTRO -->

    <div class="course-card">

        <h2>🎓 Class 1 English</h2>

        <p>
            इस course में बच्चे English को बिल्कुल basic level से सीखेंगे।
        </p>

        <button class="start-btn" onclick="showTopics()">
            🚀 Start Class 1 Course
        </button>

    </div>


    <!-- PROGRESS -->

    <div class="progress-box">

        <b>📊 Course Progress</b>

        <div id="progressText">
            0 / 30 Lessons Completed
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

    </div>


    <!-- TOPIC LIST -->

    <div id="topicList">

        <div class="topic-grid" id="topicButtons"></div>

    </div>


    <!-- LESSON AREA -->

    <div id="lessonArea">

        <div class="lesson">

            <h2 class="lesson-title" id="lessonTitle"></h2>

            <div id="lessonContent"></div>

            <div class="score" id="lessonScore"></div>

            <div class="navigation">

                <button class="prev" onclick="previousLesson()">
                    ⬅️ Previous
                </button>

                <button class="next" onclick="nextLesson()">
                    Next Lesson ➡️
                </button>

            </div>

            <button class="topic-back" onclick="showTopics()">
                📚 सभी 30 Topics देखें
            </button>

        </div>

    </div>

</div>


<footer>
    © 2026 Class 1 English Learning Course
</footer>


<script>

/* =========================================
   30 CLASS 1 ENGLISH LESSONS
========================================= */

const lessons = [

{
title:"Noun — संज्ञा",
content:`
<h3 class="lesson-subtitle">📖 Noun क्या है?</h3>

<p>
किसी व्यक्ति, स्थान, वस्तु या जानवर के नाम को
<b>Noun</b> कहते हैं।
</p>

<div class="example">
<b>Examples:</b><br>
Boy = लड़का<br>
Girl = लड़की<br>
School = विद्यालय<br>
Book = किताब<br>
Dog = कुत्ता
</div>

<h3 class="lesson-subtitle">🗣️ बोलकर सीखें</h3>

<p>
Boy, Girl, School, Book, Dog
</p>

<div class="practice">
<b>✍️ Practice:</b><br><br>
इनमें Noun कौन है?<br><br>
Boy / Run / Quickly
</div>

<div class="question">
<b>❓ Quiz:</b><br>
Which is a Noun?<br><br>

<button class="option" onclick="check(this,false)">
Run
</button>

<button class="option" onclick="check(this,true)">
Boy
</button>

<button class="option" onclick="check(this,false)">
Quickly
</button>

<div class="result"></div>
</div>
`
},

{
title:"Pronoun — सर्वनाम",
content:`
<h3 class="lesson-subtitle">📖 Pronoun क्या है?</h3>

<p>
Noun की जगह प्रयोग होने वाले शब्द को Pronoun कहते हैं।
</p>

<div class="example">
I = मैं<br>
You = तुम / आप<br>
He = वह लड़का<br>
She = वह लड़की<br>
It = यह / वह वस्तु<br>
We = हम<br>
They = वे
</div>

<div class="example">
Ram is a boy.<br>
<b>He</b> is a boy.
</div>

<div class="question">
<b>❓ Quiz:</b><br>
Ram is a boy. ___ is a boy.

<button class="option" onclick="check(this,true)">He</button>
<button class="option" onclick="check(this,false)">She</button>
<button class="option" onclick="check(this,false)">They</button>

<div class="result"></div>
</div>
`
},

{
title:"Verb — क्रिया",
content:`
<h3 class="lesson-subtitle">📖 Verb क्या है?</h3>

<p>
काम को बताने वाले शब्द को Verb कहते हैं।
</p>

<div class="example">
Run = दौड़ना<br>
Eat = खाना<br>
Read = पढ़ना<br>
Write = लिखना<br>
Play = खेलना<br>
Sleep = सोना
</div>

<div class="practice">
<b>🗣️ बोलें:</b><br>
I run.<br>
I eat.<br>
I read.<br>
I play.
</div>

<div class="question">
<b>❓ Quiz:</b><br>
Which is a Verb?

<button class="option" onclick="check(this,false)">Book</button>
<button class="option" onclick="check(this,true)">Run</button>
<button class="option" onclick="check(this,false)">Boy</button>

<div class="result"></div>
</div>
`
},

{
title:"Adjective — विशेषण",
content:`
<h3 class="lesson-subtitle">📖 Adjective क्या है?</h3>

<p>
Noun की विशेषता बताने वाले शब्द को Adjective कहते हैं।
</p>

<div class="example">
Good boy<br>
Big house<br>
Red apple<br>
Small cat
</div>

<p>
Good, Big, Red और Small विशेषता बता रहे हैं।
</p>

<div class="question">
<b>❓ Quiz:</b><br>
Red apple में Adjective कौन-सा है?

<button class="option" onclick="check(this,true)">Red</button>
<button class="option" onclick="check(this,false)">Apple</button>

<div class="result"></div>
</div>
`
},

{
title:"Articles — A, An, The",
content:`
<h3 class="lesson-subtitle">📖 Articles</h3>

<p>
English में A, An और The को Articles कहते हैं।
</p>

<div class="example">
A boy<br>
A book<br>
An apple<br>
An orange<br>
The sun
</div>

<div class="practice">
<b>Rule:</b><br>
A boy<br>
An apple
</div>

<div class="question">
<b>❓ Quiz:</b><br>
___ apple

<button class="option" onclick="check(this,false)">A</button>
<button class="option" onclick="check(this,true)">An</button>
<button class="option" onclick="check(this,false)">The</button>

<div class="result"></div>
</div>
`
},

{
title:"Singular / Plural",
content:`
<h3 class="lesson-subtitle">📖 Singular और Plural</h3>

<p>
एक व्यक्ति या वस्तु = Singular<br>
एक से अधिक = Plural
</p>

<div class="example">

One boy → Two boys<br>
One cat → Two cats<br>
One apple → Two apples
</div>

<div class="question">
<b>❓ Quiz:</b><br>
One book → Two ?

<button class="option" onclick="check(this,true)">books</button>
<button class="option" onclick="check(this,false)">book</button>

<div class="result"></div>
</div>
`
},

{
title:"Gender — लिंग",
content:`

Man → Woman<br>
King → Queen<br>
Father → Mother<br>

</div>

<div class="question">

<div class="result"></div>
</div>
`
},

{
title:"This / That",

That = वह

<div class="example">
This is a book.<br>
That is a tree.
</div>

<p>
पास की एक वस्तु → This<br>
दूर की एक वस्तु → That
</p>

<div class="question">
<b>❓ Quiz:</b><br>
पास की वस्तु के लिए क्या प्रयोग करेंगे?

<button class="option" onclick="check(this,false)">That</button>

<div class="result"></div>
</div>
`
},

{
title:"These / Those",
content:`
<h3 class="lesson-subtitle">📖 These / Those</h3>

<div class="hindi">
These = ये<br>
Those = वे
</div>

<div class="example">
These are books.<br>
Those are trees.
</div>

<p>
पास की एक से अधिक वस्तुएँ → These<br>
दूर की एक से अधिक वस्तुएँ → Those
</p>

<div class="question">
<b>❓ Quiz:</b><br>
दूर की कई वस्तुओं के लिए?

<button class="option" onclick="check(this,false)">These</button>
<button class="option" onclick="check(this,true)">Those</button>

<div class="result"></div>
</div>
`
},

{
title:"Is / Am / Are",
content:`
<h3 class="lesson-subtitle">📖 Is / Am / Are</h3>

<div class="example">
I <b>am</b> a boy.<br>
He <b>is</b> a boy.<br>
She <b>is</b> a girl.<br>
They <b>are</b> students.
</div>

<div class="practice">
I → am<br>
He / She / It → is<br>
You / We / They → are
</div>

<div class="question">
<b>❓ Quiz:</b><br>
I ___ a student.

<button class="option" onclick="check(this,false)">is</button>
<button class="option" onclick="check(this,true)">am</button>
<button class="option" onclick="check(this,false)">are</button>

<div class="result"></div>
</div>
`
},

{
title:"Opposite Words",
content:`
<h3 class="lesson-subtitle">📖 Opposite Words</h3>

<div class="example">
Big ↔ Small<br>

Good ↔ Bad<br>

<div class="question">
<b>❓ Quiz:</b><br>

content:`

<div class="question">
<b>❓ Quiz:</b><br>
One apple → Many ?

{
title:"Basic Vocabulary",
content:`
<h3 class="lesson-subtitle">📖 Basic English Words</h3>

/* =========================================
   VARIABLES
========================================= */

let currentLesson = 0;

let completed = new Array(30).fill(false);


/* =========================================
   CREATE TOPIC BUTTONS
========================================= */

function createTopics(){

    const box = document.getElementById("topicButtons");

    box.innerHTML = "";

    lessons.forEach((lesson,index)=>{

        const button = document.createElement("button");

        button.className = "topic-btn";

        button.innerHTML =
        `<span class="topic-number">${index+1}.</span>
        ${lesson.title}`;

        button.onclick = function(){

            openLesson(index);

        };

        box.appendChild(button);

    });

}


/* =========================================
   SHOW TOPICS
========================================= */

function showTopics(){

    document.getElementById("topicList").style.display="block";

    document.getElementById("lessonArea").style.display="none";

    window.scrollTo({
        top:document.getElementById("topicList").offsetTop-10,
        behavior:"smooth"
    });

}


/* =========================================
   OPEN LESSON
========================================= */

function openLesson(index){

    currentLesson=index;

    document.getElementById("topicList").style.display="none";

    document.getElementById("lessonArea").style.display="block";

    document.getElementById("lessonTitle").innerHTML =
    "Lesson " + (index+1) + ": " + lessons[index].title;

    document.getElementById("lessonContent").innerHTML =
    lessons[index].content;

    document.getElementById("lessonScore").innerHTML="";

    window.scrollTo({
        top:document.getElementById("lessonArea").offsetTop-10,
        behavior:"smooth"
    });

}


/* =========================================
   NEXT LESSON
========================================= */

function nextLesson(){

    completed[currentLesson]=true;

    updateProgress();

    if(currentLesson < lessons.length-1){

        openLesson(currentLesson+1);

    }else{

        document.getElementById("lessonScore").innerHTML =
        "🎉 बहुत बढ़िया! आपने Class 1 के सभी 30 Lessons पूरे कर लिए हैं।";

    }

}


/* =========================================
   PREVIOUS LESSON
========================================= */

function previousLesson(){

    if(currentLesson > 0){

        openLesson(currentLesson-1);

    }else{

        showTopics();

    }

}


/* =========================================
   QUIZ CHECK
========================================= */

function check(button,isCorrect){

    const parent=button.parentElement;

    const result=parent.querySelector(".result");

    const options=parent.querySelectorAll(".option");

    options.forEach(function(btn){

        btn.disabled=true;

    });

    if(isCorrect){

        button.classList.add("correct");

        result.innerHTML="✅ सही उत्तर! बहुत बढ़िया!";

        result.style.color="#16a34a";

    }else{

        button.classList.add("wrong");

        result.innerHTML="❌ गलत उत्तर। फिर से Lesson पढ़ें।";

        result.style.color="#dc2626";

    }

}


/* =========================================
   PROGRESS
========================================= */

function updateProgress(){

    let count=completed.filter(Boolean).length;

    document.getElementById("progressText").innerHTML =
    count + " / 30 Lessons Completed";

    document.getElementById("progressFill").style.width =
    ((count/30)*100) + "%";

}


/* =========================================
   START
========================================= */

createTopics();

updateProgress();

</script>
